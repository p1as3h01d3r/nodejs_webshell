apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webshell-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webshell
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              webshell-client: "true"
      ports:
        - protocol: TCP
          port: 3000
  egress: []
